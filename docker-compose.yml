version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: glossary-backend
    environment:
      - DATA_SOURCE=db
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/data:/app/frontend/data
    networks:
      - glossary-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: glossary-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - glossary-network

networks:
  glossary-network:
    driver: bridge
